name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: lawbite-app
  ECS_CLUSTER: lawbite-cluster
  ECS_SERVICE: lawbite-service

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRET_ARN=$(aws secretsmanager list-secrets --query "SecretList[?starts_with(Name,'lawbite/')].ARN" --output text --region ${{ env.AWS_REGION }})
          for arn in $SECRET_ARN; do
            NAME=$(aws secretsmanager describe-secret --secret-id $arn --query 'Name' --output text --region ${{ env.AWS_REGION }})
            VALUE=$(aws secretsmanager get-secret-value --secret-id $arn --query 'SecretString' --output text --region ${{ env.AWS_REGION }})
            KEY=$(echo $NAME | sed 's|lawbite/||')
            echo "${KEY}=${VALUE}" >> $GITHUB_ENV
          done

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg DATABASE_URL="${{ env.DATABASE_URL }}" \
            --build-arg BETTER_AUTH_SECRET="${{ env.BETTER_AUTH_SECRET }}" \
            --build-arg BETTER_AUTH_URL="${{ env.BETTER_AUTH_URL }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.NEXT_PUBLIC_APP_URL }}" \
            --build-arg GOOGLE_CLIENT_ID="${{ env.GOOGLE_CLIENT_ID }}" \
            --build-arg GOOGLE_CLIENT_SECRET="${{ env.GOOGLE_CLIENT_SECRET }}" \
            --build-arg GITHUB_CLIENT_ID="${{ env.GITHUB_CLIENT_ID }}" \
            --build-arg GITHUB_CLIENT_SECRET="${{ env.GITHUB_CLIENT_SECRET }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        id: task-def
        run: |
          aws ecs describe-task-definition --task-definition lawbite-task --region ${{ secrets.AWS_REGION }} --query 'taskDefinition.{containerDefinitions:containerDefinitions,family:family,networkMode:networkMode,volumes:volumes,placementConstraints:placementConstraints,requiresCompatibilities:requiresCompatibilities,cpu:cpu,memory:memory,executionRoleArn:executionRoleArn,taskRoleArn:taskRoleArn}' > task-definition.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          force-new-deployment: true
          image: ${{ steps.build-image.outputs.image }}
          container-name: lawbite
