name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: lawbite-app
  ECS_CLUSTER: lawbite-cluster
  ECS_SERVICE: lawbite-service
  # UPDATE THIS to your production domain (e.g. https://lawbite.ai)
  PRODUCTION_URL: http://lawbite-alb-1096330116.ap-south-1.elb.amazonaws.com

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch secrets from Secrets Manager
        id: fetch-secrets
        run: |
          get_secret() {
            aws secretsmanager get-secret-value --secret-id "lawbite/$1" --query 'SecretString' --output text 2>/dev/null || echo ""
          }
          echo "DATABASE_URL=$(get_secret DATABASE_URL)" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=$(get_secret BETTER_AUTH_SECRET)" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=$(get_secret GOOGLE_CLIENT_ID)" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=$(get_secret GOOGLE_CLIENT_SECRET)" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_ID=$(get_secret GITHUB_CLIENT_ID)" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_SECRET=$(get_secret GITHUB_CLIENT_SECRET)" >> $GITHUB_ENV
          echo "NVIDIA_API_KEY=$(get_secret NVIDIA_API_KEY)" >> $GITHUB_ENV
          echo "TAVILY_API_KEY=$(get_secret TAVILY_API_KEY)" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=$(get_secret S3_BUCKET_NAME)" >> $GITHUB_ENV

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition lawbite-task \
            --region ${{ secrets.AWS_REGION }} \
            --query 'taskDefinition.{containerDefinitions:containerDefinitions,family:family,networkMode:networkMode,volumes:volumes,placementConstraints:placementConstraints,requiresCompatibilities:requiresCompatibilities,cpu:cpu,memory:memory,executionRoleArn:executionRoleArn,taskRoleArn:taskRoleArn}' \
            > task-definition.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          force-new-deployment: true
          image: ${{ steps.build-image.outputs.image }}
          container-name: lawbite
          environment: |
            [
              {"name": "NODE_ENV", "value": "production"},
              {"name": "DATABASE_URL", "value": "${{ env.DATABASE_URL }}"},
              {"name": "BETTER_AUTH_SECRET", "value": "${{ env.BETTER_AUTH_SECRET }}"},
              {"name": "BETTER_AUTH_URL", "value": "${{ env.PRODUCTION_URL }}"},
              {"name": "NEXT_PUBLIC_APP_URL", "value": "${{ env.PRODUCTION_URL }}"},
              {"name": "GOOGLE_CLIENT_ID", "value": "${{ env.GOOGLE_CLIENT_ID }}"},
              {"name": "GOOGLE_CLIENT_SECRET", "value": "${{ env.GOOGLE_CLIENT_SECRET }}"},
              {"name": "GITHUB_CLIENT_ID", "value": "${{ env.GITHUB_CLIENT_ID }}"},
              {"name": "GITHUB_CLIENT_SECRET", "value": "${{ env.GITHUB_CLIENT_SECRET }}"},
              {"name": "NVIDIA_API_KEY", "value": "${{ env.NVIDIA_API_KEY }}"},
              {"name": "TAVILY_API_KEY", "value": "${{ env.TAVILY_API_KEY }}"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_ACCESS_KEY_ID", "value": "${{ secrets.AWS_ACCESS_KEY_ID }}"},
              {"name": "AWS_SECRET_ACCESS_KEY", "value": "${{ secrets.AWS_SECRET_ACCESS_KEY }}"},
              {"name": "S3_BUCKET_NAME", "value": "${{ env.S3_BUCKET_NAME }}"},
              {"name": "TRUSTED_ORIGINS", "value": "http://localhost:3000,${{ env.PRODUCTION_URL }}"}
            ]
